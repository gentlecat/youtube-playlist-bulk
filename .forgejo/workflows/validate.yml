name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  validate:
    runs-on: docker
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Rules the existing pages trip are relaxed in .htmlvalidate.json:
      # style-only rules are off, accessibility gaps are warnings.
      - name: HTML
        run: npx --yes html-validate@11 *.html
